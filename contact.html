<body>

<!-- NAVBAR -->

 <a href="index.html" class="logo">

  </div>
</nav>
<div class="contact-section">
  <div id="contact-form-container" class="form-card">
    
    <h2>You can find us here</h2>
    <p>Find help for your queries here:</p>

    <form class="contact-form">

      <div class="input-group">
        <input type="text" required>
        <label>Name *</label>
      </div>

      <div class="input-group">
        <input type="email" required>
        <label>Email Address *</label>
      </div>

      <div class="input-group">
        <input type="tel" maxlength="10" required 
          oninput="this.value = this.value.replace(/[^0-9]/g, '');">
        <label>Mobile Number *</label>
      </div>

      <div class="input-group">
        <select required>
          <option value="" disabled selected></option>
          <option value="captain">Captain</option>
          <option value="customer">Customer</option>
        </select>
        <label>You are a *</label>
      </div>

      <div class="input-group">
        <textarea rows="4" required></textarea>
        <label>Comment *</label>
      </div>

      <button type="submit" class="submit-btn">Submit</button>

    </form>
  </div>

  <div id="success-message" class="success-container">
    <div class="success-content">
      <h2>Thank you for reaching out!</h2>
      <p>Our team will reach out to you shortly.</p>
      <button class="done-btn" onclick="window.location.reload()">Done</button>
    </div>
  </div>
</div>

                </div>
            </div>
        </div>

    </footer>
